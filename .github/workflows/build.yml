
name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Check project files
        run: |
          if [ ! -f index.html ]; then
            echo "ERROR: index.html not found in project root"
            ls -la
            exit 1
          fi

      - name: Create Capacitor project
        run: |
          mkdir -p www
          cp index.html www/index.html

          if [ ! -f package.json ]; then
            npm init -y
          fi

          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

          if [ ! -f capacitor.config.json ] && [ ! -f capacitor.config.ts ]; then
            npx cap init "Boutik POS" com.boutik.pos --web-dir www
          fi

          if [ ! -d android ]; then
            npx cap add android
          fi

          npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: boutik-pos-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Set app icon
        run: |
          npm install sharp
          node -e "
          const sharp = require('sharp');
          const fs = require('fs');
          const sizes = {mdpi:48,hdpi:72,xhdpi:96,xxhdpi:144,xxxhdpi:192};
          (async () => {
            for (const [density,size] of Object.entries(sizes)) {
              const dir = 'android/app/src/main/res/mipmap-' + density;
              fs.mkdirSync(dir,{recursive:true});
              await sharp('icon.png').resize(size,size).png().toFile(dir+'/ic_launcher.png');
              await sharp('icon.png').resize(size,size).png().toFile(dir+'/ic_launcher_round.png');
            }
          })().catch(err => {console.error(err);process.exit(1);});
          "
